<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Thumb Sight browser extension</title>
  <desc id="d">The Thumb Sight button on a video thumbnail opens a save panel with Folders, Tags and Note tabs.</desc>
  <!-- fonts: Instrument Sans + Geist Mono (OFL), outlined by outline_text.py -->
  <defs>
    <g id="mark" fill="#ffffff">
      <path d="M11.78,7.62c-.19.74-.86,1.29-1.66,1.29-.95,0-1.72-.77-1.72-1.72,0-.79.54-1.46,1.27-1.66-.32-.1-.65-.17-1.01-.17-1.82,0-3.3,1.48-3.3,3.3s1.48,3.3,3.3,3.3,3.3-1.48,3.3-3.3c0-.37-.07-.71-.18-1.04Z"/>
      <path d="M4.14,6.79c.5-3.06,2.22-5.58,4.51-6.79,1.01.53,1.91,1.32,2.64,2.29-2.08.3-4.2,1.33-5.94,3.07-.45.45-.86.93-1.21,1.43h0ZM6.79,13.17c-3.06-.5-5.58-2.22-6.79-4.51.53-1.01,1.32-1.91,2.29-2.64.3,2.08,1.33,4.2,3.07,5.94.45.45.93.86,1.43,1.21h0ZM10.53,4.14c3.06.5,5.58,2.22,6.79,4.51-.53,1.01-1.32,1.91-2.29,2.64-.3-2.08-1.33-4.2-3.07-5.94-.45-.45-.93-.86-1.43-1.21h0ZM13.17,10.53c-.5,3.06-2.22,5.58-4.51,6.79-1.01-.53-1.91-1.32-2.64-2.29,2.08-.3,4.2-1.33,5.94-3.07.45-.45.86-.93,1.21-1.43h0Z"/>
    </g>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="300" cy="-40" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6fed" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2f6fed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="930" cy="240" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6fed" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2f6fed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thumbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22325f"/>
      <stop offset="1" stop-color="#3f2563"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="dotsFade" x1="600" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotsMask"><rect x="560" y="0" width="640" height="440" fill="url(#dotsFade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="440" rx="20"/></clipPath>
    <clipPath id="tile"><rect x="644" y="48" width="400" height="225" rx="11"/></clipPath>
    <filter id="md" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="lg" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="27" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#2f6fed" flood-opacity=".45"/></filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#0b0c0f"/>
    <rect width="1200" height="440" fill="url(#glowTop)"/>
    <rect width="1200" height="440" fill="url(#glowRight)"/>
    <rect x="560" width="640" height="440" fill="url(#dots)" mask="url(#dotsMask)"/>

    <text x="64" y="100" font-family="Geist Mono" font-weight="500" font-size="14" letter-spacing="1.4" fill="#7b8492">BROWSER EXTENSION · CHROMIUM MV3</text>

    <rect x="64" y="128" width="64" height="64" rx="19" fill="url(#grad)" filter="url(#glow)"/>
    <use href="#mark" transform="translate(78 142) scale(2.0785)"/>
    <text x="148" y="182" font-family="Instrument Sans" font-weight="700" font-size="60" letter-spacing="-1.8" fill="#e8eaee">Thumb Sight</text>

    <text x="64" y="252" font-family="Instrument Sans" font-weight="400" font-size="24" fill="#9aa1ad">Save YouTube thumbnails and Pinterest images</text>
    <text x="64" y="288" font-family="Instrument Sans" font-weight="400" font-size="24" fill="#9aa1ad">to your private <tspan fill="#e8eaee" font-weight="500">Thumb Sight</tspan> library.</text>

    <rect x="64" y="324" width="72" height="36" rx="18" fill="#1d2b4a"/>
    <rect x="64.5" y="324.5" width="71" height="35" rx="17.5" fill="none" stroke="#6ea0ff" stroke-opacity=".28"/>
    <text x="100" y="347" text-anchor="middle" font-family="Geist Mono" font-weight="500" font-size="15" letter-spacing=".6" fill="#9dbfff">BETA</text>
    <rect x="146" y="324" width="140" height="36" rx="18" fill="#0e1015"/>
    <rect x="146.5" y="324.5" width="139" height="35" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="216" y="347" text-anchor="middle" font-family="Geist Mono" font-weight="500" font-size="15" letter-spacing=".6" fill="#c3c7ce">CHROME 140+</text>
    <rect x="296" y="324" width="140" height="36" rx="18" fill="#0e1015"/>
    <rect x="296.5" y="324.5" width="139" height="35" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="366" y="347" text-anchor="middle" font-family="Geist Mono" font-weight="500" font-size="15" letter-spacing=".6" fill="#c3c7ce">INVITE-ONLY</text>

    <g filter="url(#md)">
      <rect x="644" y="48" width="400" height="225" rx="11" fill="#12141a"/>
    </g>
    <g clip-path="url(#tile)">
      <rect x="644" y="48" width="400" height="225" fill="url(#thumbBg)"/>
      <circle cx="790" cy="262" r="104" fill="#b797ff" fill-opacity=".5"/>
      <circle cx="700" cy="196" r="44" fill="#6ccfb8" fill-opacity=".42"/>
      <rect x="848" y="84" width="166" height="26" rx="5" fill="#e8eaee"/>
      <rect x="886" y="118" width="128" height="26" rx="5" fill="#9dbfff"/>
    </g>
    <rect x="644.5" y="48.5" width="399" height="224" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

    <circle cx="690" cy="94" r="24" fill="#2f6fed" filter="url(#glow)"/>
    <use href="#mark" transform="translate(676.5 80.5) scale(1.559)"/>
    <path d="M704 104 L704 127 L709.6 121.6 L713.6 130.4 L717.3 128.8 L713.4 120.2 L721 120.2 Z" fill="#ffffff" stroke="#0b0c0f" stroke-width="1.6" stroke-linejoin="round"/>

    <g filter="url(#lg)">
      <rect x="776" y="184" width="384" height="236" rx="14" fill="#1e222c"/>
    </g>
    <rect x="776.5" y="184.5" width="383" height="235" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".13"/>

    <rect x="796" y="204" width="30" height="30" rx="9" fill="url(#grad)"/>
    <use href="#mark" transform="translate(802.5 210.5) scale(0.981)"/>
    <text x="838" y="226" font-family="Instrument Sans" font-weight="600" font-size="19" fill="#e8eaee">Save to Thumb Sight</text>
    <rect x="1048" y="207" width="92" height="24" rx="12" fill="#ffffff" fill-opacity=".08"/>
    <text x="1094" y="223.5" text-anchor="middle" font-family="Geist Mono" font-weight="500" font-size="12" letter-spacing="1" fill="#c3c7ce">YOUTUBE</text>

    <text x="796" y="270" font-family="Instrument Sans" font-weight="500" font-size="16" fill="#e8eaee">Folders</text>
    <text x="874" y="270" font-family="Instrument Sans" font-weight="500" font-size="16" fill="#9aa1ad">Tags</text>
    <text x="930" y="270" font-family="Instrument Sans" font-weight="500" font-size="16" fill="#9aa1ad">Note</text>
    <rect x="776" y="282" width="384" height="1" fill="#ffffff" fill-opacity=".07"/>
    <rect x="796" y="280" width="56" height="2" rx="1" fill="#6ea0ff"/>

    <rect x="796" y="298" width="20" height="20" rx="5" fill="#2f6fed"/>
    <path d="M800.6 308.4 L804.4 312.2 L811.6 304.4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="830" y="314" font-family="Instrument Sans" font-weight="400" font-size="17" fill="#e8eaee">Bold close-ups</text>
    <rect x="796" y="332" width="20" height="20" rx="5" fill="#0e1015"/>
    <rect x="796.5" y="332.5" width="19" height="19" rx="4.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="830" y="348" font-family="Instrument Sans" font-weight="400" font-size="17" fill="#c3c7ce">Arrows and circles</text>

    <text x="1036" y="389" text-anchor="end" font-family="Instrument Sans" font-weight="500" font-size="16" fill="#c3c7ce">Cancel</text>
    <rect x="1052" y="364" width="88" height="36" rx="8" fill="#2f6fed" filter="url(#glow)"/>
    <text x="1096" y="388" text-anchor="middle" font-family="Instrument Sans" font-weight="600" font-size="16" fill="#ffffff">Save</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
